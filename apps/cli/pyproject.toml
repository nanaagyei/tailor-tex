[project]
name = "tailortex-cli"
version = "0.1.0"
description = "TailorTex command-line interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tailortex",
    "typer>=0.12",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailortex_cli"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv.sources]
tailortex = { path = "../../packages/core", editable = true }

[project.scripts]
tailortex = "tailortex_cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
