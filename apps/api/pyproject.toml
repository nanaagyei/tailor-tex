[project]
name = "tailortex-api"
version = "0.1.0"
description = "TailorTex local API server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tailortex",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailortex_api"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "tailortex-cli",
]

[tool.uv.sources]
tailortex = { path = "../../packages/core", editable = true }
tailortex-cli = { path = "../cli", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
