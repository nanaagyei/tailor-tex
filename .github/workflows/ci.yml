name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tracked Markdown links
        run: python scripts/check_md_links.py

      - name: Test Markdown link checker
        run: python -m unittest discover -s scripts/tests -v

  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: cd packages/core && uv sync

      - name: Lint
        run: cd packages/core && uv run ruff check src/ tests/

      - name: Type check
        run: cd packages/core && uv run mypy src/

      - name: Test
        run: cd packages/core && uv run pytest -v

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: cd apps/web && pnpm install --frozen-lockfile

      - name: Lint
        run: cd apps/web && pnpm lint

      - name: Type check
        run: cd apps/web && pnpm tsc --noEmit

      - name: Build
        run: cd apps/web && pnpm build
