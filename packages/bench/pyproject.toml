[project]
name = "tailortex-bench"
version = "0.1.0"
description = "Synthetic benchmark harness for TailorTex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["tailortex", "typer>=0.12", "jsonschema>=4.23"]

[project.optional-dependencies]
providers = ["httpx>=0.27"]

[project.scripts]
tailortex-bench = "tailortex_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailortex_bench"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-jsonschema>=4.23"]

[tool.uv.sources]
tailortex = { path = "../core", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
